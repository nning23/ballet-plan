<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballet Planner · 芭蕾計劃本</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FFEAE3;
            --paper: #FFF5F2;
            --blush: #F5E6E0;
            --rose: #E8B4B8;
            --dusty: #B8A0A0;
            --ballet: #D4A5A5;
            --deep: #8B6B6B;
            --ink: #6B5550;
            --gold: #C9B896;
            --velvet: #8B4555;
            --velvet-dark: #6B3542;
            --highlight: #FFF9C4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Serif TC', 'Playfair Display', serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 開屏動畫 */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--velvet-dark);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .curtain-left, .curtain-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, var(--velvet-dark) 0%, var(--velvet) 50%, var(--velvet-dark) 100%);
            transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .curtain-left { left: 0; }
        .curtain-right { right: 0; }

        .curtain-left.open { transform: translateX(-100%); }
        .curtain-right.open { transform: translateX(100%); }

        .splash-title {
            position: relative;
            z-index: 10;
            text-align: center;
            color: var(--gold);
        }

        .splash-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-style: italic;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .splash-title p {
            font-size: 16px;
            letter-spacing: 2px;
        }

        .skip-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: 'Noto Serif TC', serif;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 20;
        }

        /* 主內容 */
        .main-content {
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .main-content.visible {
            opacity: 1;
        }

        /* 手機桌面布局 */
        .phone-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--cream);
        }

        /* 頂部導航 */
        .top-bar {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--paper);
            border-bottom: 1px solid var(--blush);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--rose), var(--ballet));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--deep);
        }

        .reward-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--blush);
            border-radius: 20px;
            font-size: 14px;
            color: var(--deep);
        }

        /* 日期顯示 */
        .date-display {
            padding: 24px 20px;
            text-align: center;
        }

        .date-main {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--deep);
            margin-bottom: 8px;
        }

        .date-sub {
            font-size: 16px;
            color: var(--dusty);
            letter-spacing: 2px;
        }

        /* 內容區域 */
        .content-area {
            flex: 1;
            padding: 0 20px 100px;
            overflow-y: auto;
        }

        /* 任務卡片 */
        .task-card {
            background: var(--paper);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--blush);
            box-shadow: 0 2px 8px rgba(139, 107, 107, 0.08);
            transition: all 0.3s;
        }

        .task-card:active {
            transform: scale(0.98);
        }

        .task-card.priority {
            background: var(--highlight);
            border-color: #E6D700;
        }

        .task-card.completed {
            opacity: 0.6;
        }

        .task-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--rose);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .task-checkbox.checked {
            background: var(--ballet);
            border-color: var(--ballet);
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-size: 16px;
            color: var(--deep);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
        }

        .task-category {
            font-size: 20px;
        }

        .task-meta {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: var(--dusty);
        }

        /* 子任務 */
        .subtasks {
            margin-top: 12px;
            padding-left: 36px;
        }

        .subtask-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            font-size: 14px;
            color: var(--dusty);
        }

        .subtask-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--rose);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .subtask-checkbox.checked {
            background: var(--ballet);
            border-color: var(--ballet);
        }

        .subtask-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 12px;
        }

        /* 快速添加 */
        .quick-add {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 440px;
            padding: 16px;
            background: var(--paper);
            border-radius: 24px;
            border: 1px solid var(--blush);
            box-shadow: 0 4px 20px rgba(139, 107, 107, 0.15);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .quick-add-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            font-family: 'Noto Serif TC', serif;
            font-size: 15px;
            color: var(--ink);
            outline: none;
        }

        .quick-add-btn {
            width: 48px;
            height: 48px;
            border: none;
            background: linear-gradient(135deg, var(--rose), var(--ballet));
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(212, 165, 165, 0.3);
        }

        /* 底部導航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--paper);
            border-top: 1px solid var(--blush);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            box-shadow: 0 -2px 10px rgba(139, 107, 107, 0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--dusty);
        }

        .nav-item.active {
            color: var(--ballet);
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* 空狀態 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--dusty);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        /* 獎勵動畫 */
        .reward-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            animation: rewardPop 1s ease;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes rewardPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* 響應式 */
        @media (max-width: 480px) {
            .phone-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 開屏動畫 -->
    <div class="splash-screen" id="splashScreen">
        <div class="curtain-left" id="curtainLeft"></div>
        <div class="curtain-right" id="curtainRight"></div>
        <div class="splash-title">
            <h1>Ballet Planner</h1>
            <p>芭蕾計劃本</p>
        </div>
        <button class="skip-btn" onclick="skipSplash()">跳過 Skip</button>
    </div>

    <!-- 主內容 -->
    <div class="main-content" id="mainContent">
        <div class="phone-container">
            <!-- 頂部導航 -->
            <div class="top-bar">
                <div class="logo">
                    <div class="logo-icon">🩰</div>
                    <div class="logo-text">Ballet Planner</div>
                </div>
                <div class="reward-badge">
                    <span>🎀</span>
                    <span id="bowCount">0</span>
                </div>
            </div>

            <!-- 日期顯示 -->
            <div class="date-display">
                <div class="date-main" id="dateMain"></div>
                <div class="date-sub" id="dateSub"></div>
            </div>

            <!-- 內容區域 -->
            <div class="content-area" id="contentArea">
                <!-- 任務列表將在這裡渲染 -->
            </div>

            <!-- 快速添加 -->
            <div class="quick-add">
                <input type="text" class="quick-add-input" id="quickAddInput" placeholder="添加新任務... Add a task">
                <button class="quick-add-btn" onclick="showAddPanel()">+</button>
            </div>

            <!-- 底部導航 -->
            <div class="bottom-nav">
                <div class="nav-item active" onclick="switchTab('home')">
                    <div class="nav-icon">🏠</div>
                    <div class="nav-label">首頁</div>
                </div>
                <div class="nav-item" onclick="switchTab('calendar')">
                    <div class="nav-icon">📅</div>
                    <div class="nav-label">日曆</div>
                </div>
                <div class="nav-item" onclick="switchTab('list')">
                    <div class="nav-icon">📋</div>
                    <div class="nav-label">清單</div>
                </div>
                <div class="nav-item" onclick="switchTab('profile')">
                    <div class="nav-icon">👤</div>
                    <div class="nav-label">我的</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 檢查是否第一次打開
        const hasSeenSplash = localStorage.getItem('hasSeenSplash');
        
        if (hasSeenSplash) {
            document.getElementById('splashScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.add('visible');
        } else {
            setTimeout(() => {
                document.getElementById('curtainLeft').classList.add('open');
                document.getElementById('curtainRight').classList.add('open');
                
                setTimeout(() => {
                    document.getElementById('splashScreen').classList.add('hidden');
                    document.getElementById('mainContent').classList.add('visible');
                    localStorage.setItem('hasSeenSplash', 'true');
                }, 2000);
            }, 1000);
        }

        function skipSplash() {
            document.getElementById('splashScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.add('visible');
            localStorage.setItem('hasSeenSplash', 'true');
        }

        // 數據
        let tasks = JSON.parse(localStorage.getItem('balletTasks')) || [];
        let rewards = JSON.parse(localStorage.getItem('balletRewards')) || { bows: 0, shoes: 0, totalCompleted: 0 };
        let currentTab = 'home';

        // 初始化
        function init() {
            updateDate();
            renderTasks();
            updateRewards();
        }

        function updateDate() {
            const now = new Date();
            const options = { month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('dateMain').textContent = now.toLocaleDateString('zh-TW', options);
            document.getElementById('dateSub').textContent = 'Today · 今天';
        }

        function renderTasks() {
            const today = new Date();
            const dateKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
            const todayTasks = tasks.filter(t => t.date === dateKey);
            
            const contentArea = document.getElementById('contentArea');
            
            if (todayTasks.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🩰</div>
                        <div>暫無任務，添加一個吧</div>
                        <div style="font-size: 14px; margin-top: 8px;">No tasks yet, add one</div>
                    </div>
                `;
                return;
            }
            
            contentArea.innerHTML = todayTasks.map(task => `
                <div class="task-card ${task.priority ? 'priority' : ''} ${task.completed ? 'completed' : ''}">
                    <div class="task-header">
                        <div class="task-checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})"></div>
                        <div class="task-content">
                            <div class="task-title">
                                <span class="task-category">${getCategoryIcon(task.category)}</span>
                                ${task.title}
                            </div>
                            <div class="task-meta">
                                ${task.deadline ? `<span>📅 ${task.deadline}</span>` : ''}
                                ${task.reminder ? `<span>⏰ ${task.reminder}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    ${task.subtasks.length > 0 ? `
                        <div class="subtasks">
                            ${task.subtasks.map((st, i) => `
                                <div class="subtask-item">
                                    <div class="subtask-checkbox ${st.completed ? 'checked' : ''}" onclick="toggleSubtask(${task.id}, ${i})"></div>
                                    <span style="${st.completed ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${st.title}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function getCategoryIcon(category) {
            return { work: '🍞', life: '💗', study: '💎' }[category];
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            task.completed = !task.completed;
            
            if (task.completed) {
                rewards.totalCompleted++;
                rewards.bows++;
                
                if (rewards.totalCompleted % 10 === 0) {
                    rewards.shoes++;
                    showReward('🩰');
                } else {
                    showReward('🎀');
                }
                
                updateRewards();
            }
            
            saveTasks();
            renderTasks();
        }

        function toggleSubtask(taskId, index) {
            const task = tasks.find(t => t.id === taskId);
            if (task && task.subtasks[index]) {
                task.subtasks[index].completed = !task.subtasks[index].completed;
                saveTasks();
                renderTasks();
            }
        }

        function showReward(emoji) {
            const el = document.createElement('div');
            el.className = 'reward-animation';
            el.textContent = emoji;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function updateRewards() {
            document.getElementById('bowCount').textContent = rewards.bows;
        }

        function showAddPanel() {
            const title = prompt('任務名稱 Task name:');
            if (!title) return;
            
            const category = prompt('分類 (work/life/study):', 'work');
            const priority = confirm('是否優先？Priority?');
            
            const today = new Date();
            const dateKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
            
            const task = {
                id: Date.now(),
                title,
                category: category || 'work',
                priority,
                date: dateKey,
                deadline: '',
                reminder: '',
                completed: false,
                subtasks: [],
                createdAt: new Date().toISOString()
            };
            
            tasks.push(task);
            saveTasks();
            renderTasks();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
            
            // 這裡可以添加切換視圖的邏輯
            alert(`切換到 ${tab} 視圖（開發中）`);
        }

        function saveTasks() {
            localStorage.setItem('balletTasks', JSON.stringify(tasks));
            localStorage.setItem('balletRewards', JSON.stringify(rewards));
        }

        document.getElementById('quickAddInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') showAddPanel();
        });

        init();
    </script>
</body>
</html>
